[package]
name = "quin"
version = "0.1.0"
edition = "2024"
description = "A small, fast, keyboard-driven GUI code editor"
license = "MIT"

[dependencies]
# Window + input (cross-platform, wasm-capable).
winit = { version = "=0.31.0-beta.3", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
# CPU framebuffer presentation. No GPU driver needed.
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen", "kms"] }
# Pure-Rust font rasterizer.
fontdue = "0.9"
# Rope text storage: edits anywhere in big files stay fast.
ropey = "1.6"
# Regex engine used by syntax highlighting and search.
regex = "1"
# Display width of characters (CJK, etc).
unicode-width = "0.2"
# Terminal emulation: escape-sequence parser and pseudo-terminal.
vte = "0.15"
portable-pty = "0.9"
rustybuzz = "0.20.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
